[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-mind"
version = "0.0.1"
description = "Stream-Mind P0: 영속 스트림 오케스트레이터 시제품 (이벤트 구동, 상태 포크, 공통 도구 규격, 행동 위험 등급)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.56"]
dev = ["pytest>=8"]

[project.scripts]
stream-mind-gate1 = "stream_mind.bench.gate1:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
