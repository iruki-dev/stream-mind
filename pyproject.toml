[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-mind"
version = "0.0.1"
description = "Stream-Mind P0: 영속 스트림 오케스트레이터 시제품 (이벤트 구동, 상태 포크, 공통 도구 규격, 행동 위험 등급)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
# P0 오케스트레이터와 시뮬레이션 백엔드는 표준 라이브러리만 쓴다. StreamLM 학습·추론에는 torch가 필요하다.
train = ["torch>=2.2"]
hf = ["torch>=2.2", "transformers>=4.56"]
dev = ["pytest>=8", "torch>=2.2"]

[project.scripts]
stream-mind-gate1 = "stream_mind.bench.gate1:main"
stream-mind-gates = "stream_mind.bench.gates:main"
stream-mind-sft = "stream_mind.train.sft:main"
stream-mind-rl = "stream_mind.train.rl:main"
stream-mind-data = "stream_mind.data.build:main"
stream-mind-demo = "stream_mind.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
